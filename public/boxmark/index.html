<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>箱唛切割器 · 一页一个箱唛</title>
  <link rel="stylesheet" href="styles.css" />
  <script>if(location.pathname.includes('/boxmark/')) location.replace('../index.html#box');</script>
</head>
<body>

<div class="bg-layer">
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>
  <div class="bg-glow g3"></div>
  <div class="bg-grid"></div>
</div>

<main class="app">

  <header class="topbar glass">
    <div class="brand">
      <div class="brand-mark"><span></span></div>
      <div class="brand-text">
        <h1>箱唛切割器</h1>
        <p>识别箱唛 · 自动裁切 · 一页一个</p>
      </div>
    </div>
    <div class="topbar-actions">
      <a href="../index.html" class="btn ghost nav-link" title="返回首页">🏠 首页</a>
      <a href="../search/index.html" class="btn ghost nav-link" title="关键词排名查询">🛒 关键词排名</a>
      <span class="chip" id="file-chip" hidden></span>
      <button id="btn-reanalyze" class="btn ghost" hidden>重新分析</button>
    </div>
  </header>

  <section id="drop" class="dropzone glass">
    <input id="file" type="file" accept="application/pdf,.pdf" hidden />
    <div class="drop-icon">
      <svg viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 14h32v26H8z"/>
        <path d="M8 22h32M20 22v18"/>
        <path d="M24 4v10M19 9l5-5 5 5"/>
      </svg>
    </div>
    <div class="drop-title">拖入箱唛 PDF，或点击选择文件</div>
    <div class="drop-sub">全部在本机浏览器内处理，文件不会上传到任何服务器</div>
  </section>

  <section id="panel" class="panel glass" hidden>
    <div class="panel-row">
      <div class="field" data-show="auto trim grid">
        <label>识别模式</label>
        <div class="segmented" id="seg-mode">
          <button data-mode="auto" class="active">自动识别</button>
          <button data-mode="trim">每页一个</button>
          <button data-mode="grid">手动网格</button>
        </div>
        <div class="hint" id="mode-hint">自动分析页面空白，把多个箱唛分割开</div>
      </div>
    </div>

    <div class="panel-row">
      <div class="field" data-show="auto">
        <label>标签间距阈值 <span class="val" id="v-gap">3.0 mm</span></label>
        <input type="range" id="p-gap" min="0.5" max="20" step="0.5" value="3" />
        <div class="hint">间距大于此值即判定为两个箱唛；切得太碎就调大</div>
      </div>
      <div class="field" data-show="auto">
        <label>最小箱唛尺寸 <span class="val" id="v-min">8 mm</span></label>
        <input type="range" id="p-min" min="2" max="60" step="1" value="8" />
        <div class="hint">小于此尺寸的碎块会被丢弃</div>
      </div>
    </div>

    <div class="panel-row">
      <div class="field" data-show="grid">
        <label>行数 <span class="val" id="v-rows">2</span></label>
        <input type="range" id="p-rows" min="1" max="10" step="1" value="2" />
      </div>
      <div class="field" data-show="grid">
        <label>列数 <span class="val" id="v-cols">2</span></label>
        <input type="range" id="p-cols" min="1" max="10" step="1" value="2" />
      </div>
    </div>

    <div class="panel-row">
      <div class="field" data-show="auto trim grid">
        <label>输出边距 <span class="val" id="v-margin">1.5 mm</span></label>
        <input type="range" id="p-margin" min="0" max="15" step="0.5" value="1.5" />
        <div class="hint">每个箱唛四周保留的空白</div>
      </div>
      <div class="field" data-show="auto trim grid">
        <label>分析精度</label>
        <select id="p-quality">
          <option value="1.2">快速</option>
          <option value="1.6" selected>标准</option>
          <option value="2.2">高精（细线更准）</option>
        </select>
        <div class="hint">调整后需重新分析</div>
      </div>
    </div>
  </section>

  <section id="stats" class="stats" hidden></section>
  <section id="results" class="results"></section>

</main>

<div id="dock" class="dock glass" hidden>
  <div class="dock-info" id="dock-text">—</div>
  <div class="dock-actions">
    <button id="btn-clear" class="btn ghost">清空</button>
    <button id="btn-export" class="btn primary">导出 PDF</button>
  </div>
</div>

<div id="progress" class="progress-overlay" hidden>
  <div class="progress-card glass">
    <div class="spinner"></div>
    <div class="progress-text" id="progress-text">处理中…</div>
    <div class="progress-bar"><i id="progress-fill"></i></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
