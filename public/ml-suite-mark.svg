<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">ML Suite</title>
  <desc id="desc">Centered white ML lettering on the existing lavender rose gradient tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#ff9ad8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="66" fill="url(#tile)"/>
  <text x="128" y="132" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="106" font-weight="800" letter-spacing="-7">ML</text>
</svg>
