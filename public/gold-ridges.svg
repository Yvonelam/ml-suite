<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" preserveAspectRatio="none" role="img" aria-label="层叠山峦与湖面倒影">
  <defs>
    <!-- 五层山：越远越亮，越近越黑，靠明度差做纵深；每层波形刻意错开，避免看出重复节拍 -->
    <linearGradient id="f5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3721"/>
      <stop offset=".5" stop-color="#2e2214"/>
      <stop offset="1" stop-color="#1e160d"/>
    </linearGradient>
    <linearGradient id="f4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332616"/>
      <stop offset="1" stop-color="#190f09"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21170e"/>
      <stop offset="1" stop-color="#100b06"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160f08"/>
      <stop offset="1" stop-color="#0b0805"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0906"/>
      <stop offset="1" stop-color="#060403"/>
    </linearGradient>

    <!-- 山脊金边：两头淡、中间亮 -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0c886" stop-opacity="0"/>
      <stop offset=".18" stop-color="#f0c886" stop-opacity=".45"/>
      <stop offset=".48" stop-color="#ffe6b8" stop-opacity=".88"/>
      <stop offset=".72" stop-color="#f0c886" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f0c886" stop-opacity="0"/>
    </linearGradient>

    <!-- 湖面：水面越近越暗，天光只留在水天交界处 -->
    <linearGradient id="wtr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2c1b"/>
      <stop offset=".1" stop-color="#221710"/>
      <stop offset=".55" stop-color="#0c0805"/>
      <stop offset="1" stop-color="#050402"/>
    </linearGradient>
    <!-- 水天交界那条亮线 -->
    <linearGradient id="hzn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe6b8" stop-opacity="0"/>
      <stop offset=".26" stop-color="#ffdca4" stop-opacity=".40"/>
      <stop offset=".5" stop-color="#fff2d2" stop-opacity=".78"/>
      <stop offset=".74" stop-color="#ffdca4" stop-opacity=".40"/>
      <stop offset="1" stop-color="#ffe6b8" stop-opacity="0"/>
    </linearGradient>
    <!-- 倒影用软光斑叠出来，别用硬边多边形，会像地上的光斑 -->
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffddab" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#e8b868" stop-opacity=".10"/>
      <stop offset="1" stop-color="#d8a95e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffdcae" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffdcae" stop-opacity="0"/>
    </radialGradient>
    <!-- 水面范围，用来裁剪倒影 -->
    <clipPath id="wc"><rect x="0" y="438" width="1600" height="122"/></clipPath>
    <!-- 盖在倒影上，让倒影越往下越沉 -->
    <linearGradient id="sink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050402" stop-opacity="0"/>
      <stop offset=".45" stop-color="#050402" stop-opacity=".35"/>
      <stop offset="1" stop-color="#050402" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <!-- 远山：主峰偏右，是整幅画面的视觉落点 -->
  <path d="M0 268 C110 232 196 176 300 198 C404 220 452 268 560 258 C668 248 742 152 862 168 C982 184 1030 262 1146 250 C1262 238 1330 186 1436 202 C1520 214 1560 246 1600 240 L1600 440 L0 440 Z" fill="url(#f5)"/>
  <path d="M0 268 C110 232 196 176 300 198 C404 220 452 268 560 258 C668 248 742 152 862 168 C982 184 1030 262 1146 250 C1262 238 1330 186 1436 202 C1520 214 1560 246 1600 240" fill="none" stroke="url(#rim)" stroke-width="2.2"/>

  <ellipse cx="820" cy="300" rx="840" ry="26" fill="url(#mist)"/>

  <!-- 次远山：节奏与远山错开 -->
  <path d="M0 322 C130 300 244 336 360 318 C476 300 540 264 640 282 C740 300 812 344 928 330 C1044 316 1108 282 1220 298 C1332 314 1470 340 1600 326 L1600 440 L0 440 Z" fill="url(#f4)"/>
  <path d="M0 322 C130 300 244 336 360 318 C476 300 540 264 640 282 C740 300 812 344 928 330 C1044 316 1108 282 1220 298 C1332 314 1470 340 1600 326" fill="none" stroke="url(#rim)" stroke-width="1.8" opacity=".9"/>

  <ellipse cx="700" cy="350" rx="780" ry="22" fill="url(#mist)"/>

  <!-- 中景山 -->
  <path d="M0 368 C150 348 262 380 386 366 C510 352 590 320 704 336 C818 352 890 388 1004 376 C1118 364 1210 336 1320 348 C1430 360 1522 380 1600 372 L1600 440 L0 440 Z" fill="url(#f3)"/>
  <path d="M0 368 C150 348 262 380 386 366 C510 352 590 320 704 336 C818 352 890 388 1004 376 C1118 364 1210 336 1320 348 C1430 360 1522 380 1600 372" fill="none" stroke="url(#rim)" stroke-width="1.6" opacity=".8"/>

  <ellipse cx="920" cy="392" rx="720" ry="18" fill="url(#mist)"/>

  <!-- 近山 -->
  <path d="M0 406 C160 390 290 416 424 404 C558 392 646 366 772 380 C898 394 966 424 1086 414 C1206 404 1300 384 1414 394 C1528 404 1568 412 1600 406 L1600 440 L0 440 Z" fill="url(#f2)"/>
  <path d="M0 406 C160 390 290 416 424 404 C558 392 646 366 772 380 C898 394 966 424 1086 414 C1206 404 1300 384 1414 394 C1528 404 1568 412 1600 406" fill="none" stroke="url(#rim)" stroke-width="1.4" opacity=".7"/>

  <!-- 最前一道岸线：压在水边，等于把山脚"踩"进湖里 -->
  <path d="M0 430 C170 420 300 440 440 432 C580 424 672 404 802 414 C932 424 1002 446 1130 438 C1258 430 1360 416 1470 424 C1550 430 1578 434 1600 430 L1600 440 L0 440 Z" fill="url(#f1)"/>
  <path d="M0 430 C170 420 300 440 440 432 C580 424 672 404 802 414 C932 424 1002 446 1130 438 C1258 430 1360 416 1470 424 C1550 430 1578 434 1600 430" fill="none" stroke="url(#rim)" stroke-width="1.2" opacity=".55"/>

  <!-- 湖面 -->
  <rect x="0" y="438" width="1600" height="122" fill="url(#wtr)"/>
  <!-- 山峦倒影：把远山/次远山沿水天交界上下翻折，裁进水面里；没有倒影的水面永远是块黑板 -->
  <g clip-path="url(#wc)">
    <path d="M0 268 C110 232 196 176 300 198 C404 220 452 268 560 258 C668 248 742 152 862 168 C982 184 1030 262 1146 250 C1262 238 1330 186 1436 202 C1520 214 1560 246 1600 240 L1600 440 L0 440 Z" transform="translate(0,876) scale(1,-1)" fill="#100b07" opacity=".62"/>
    <path d="M0 322 C130 300 244 336 360 318 C476 300 540 264 640 282 C740 300 812 344 928 330 C1044 316 1108 282 1220 298 C1332 314 1470 340 1600 326 L1600 440 L0 440 Z" transform="translate(0,876) scale(1,-1)" fill="#0a0705" opacity=".55"/>
  </g>
  <rect x="0" y="438" width="1600" height="122" fill="url(#sink)"/>
  <!-- 倒影：一叠由窄到宽、由亮到暗的软光斑 -->
  <ellipse cx="806" cy="446" rx="118" ry="7" fill="url(#glow)" opacity="1.25"/>
  <ellipse cx="806" cy="462" rx="176" ry="13" fill="url(#glow)" opacity="1.05"/>
  <ellipse cx="806" cy="484" rx="252" ry="20" fill="url(#glow)" opacity=".9"/>
  <ellipse cx="806" cy="512" rx="336" ry="28" fill="url(#glow)" opacity=".58"/>
  <ellipse cx="806" cy="546" rx="430" ry="34" fill="url(#glow)" opacity=".38"/>
  <!-- 水天交界亮线 -->
  <rect x="0" y="436.5" width="1600" height="3" fill="url(#hzn)"/>
  <!-- 涟漪：近处短而亮，远处长而淡 -->
  <ellipse cx="806" cy="452" rx="96" ry="1.5" fill="#fff2d2" opacity=".40"/>
  <ellipse cx="806" cy="460" rx="164" ry="1.6" fill="#ffe6b8" opacity=".26"/>
  <ellipse cx="740" cy="472" rx="214" ry="2" fill="#ffe6b8" opacity=".17"/>
  <ellipse cx="880" cy="488" rx="272" ry="2.3" fill="#ffe6b8" opacity=".12"/>
  <ellipse cx="790" cy="510" rx="346" ry="2.7" fill="#ffe6b8" opacity=".08"/>
  <ellipse cx="830" cy="538" rx="430" ry="3.2" fill="#ffe6b8" opacity=".05"/>
</svg>
