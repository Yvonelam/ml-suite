<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ML Suite · 管理员工作区</title><style>

enter}.nav button span{width:auto}.heading{align-items:start;gap:10px;flex-direction:column}.grid{grid-template-columns:1fr}.panel{padding:15px}.table th:nth-child(2),.table td:nth-child(2){display:none}.top{padding:0 14px}}
.topright{display:flex;align-items:center;gap:10px}.return-workspace{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid rgba(56,189,248,.23);border-radius:8px;background:linear-gradient(120deg,rgba(59,130,246,.16),rgba(56,189,248,.07));color:#c7eaff;text-decoration:none;font-size:11px;transition:.18s}.return-workspace:hover{border-color:var(--glass-hover);background:rgba(59,130,246,.22);transform:translateY(-1px);box-shadow:0 5px 18px rgba(56,189,248,.12)}.account-wrap{position:relative;display:flex;align-items:center}.avatar{cursor:pointer;transition:border-color .15s,box-shadow .15s}.avatar:hover,.avatar[aria-expanded="true"]{border-color:var(--glass-hover);box-shadow:0 0 0 3px rgba(56,189,248,.11)}.account-menu{position:absolute;top:calc(100% + 9px);right:0;width:230px;padding:8px;border:1px solid var(--glass-border);border-radius:13px;background:rgba(22,22,28,.9);backdrop-filter:blur(22px);box-shadow:0 18px 48px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.06);z-index:8;transform-origin:top right;animation:menuIn .14s ease-out}@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}.account-menu[hidden],.switch-shade[hidden]{display:none!important}.menu-user{display:flex;align-items:center;gap:10px;padding:9px 8px 12px;border-bottom:1px solid var(--bd);margin-bottom:5px}.menu-face{width:31px;height:31px;display:grid;place-items:center;flex:none;border:1px solid rgba(56,189,248,.24);border-radius:50%;background:rgba(56,189,248,.1);color:var(--cyan);font-weight:700}.menu-user b{display:block;font-size:11px}.menu-user small{display:block;margin-top:2px;color:var(--mut);font-size:9px}.account-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 9px;border:0;border-radius:8px;background:transparent;color:var(--tx2);text-align:left;font-size:11px;cursor:pointer}.account-menu button:hover{background:rgba(255,255,255,.06);color:var(--ink)}.account-menu button i{width:17px;color:var(--cyan);font-style:normal;text-align:center}.account-menu button.danger:hover{color:#fca5a5;background:rgba(239,68,68,.08)}.switch-shade{position:fixed;inset:0;z-index:12;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.68);backdrop-filter:blur(5px)}.switch-dialog{width:min(390px,100%);padding:22px;border:1px solid var(--glass-border);border-radius:15px;background:linear-gradient(145deg,rgba(30,30,37,.97),rgba(16,16,20,.98));box-shadow:0 24px 75px rgba(0,0,0,.62),inset 0 1px rgba(255,255,255,.07)}.switch-dialog h2{font-size:16px;margin:0}.switch-dialog>p{margin:6px 0 14px;color:var(--mut);font-size:10px}.switch-field{display:grid;gap:5px;margin-top:11px;color:var(--tx2);font-size:10px}.switch-field input{height:38px;padding:0 10px;border:1px solid var(--bd2);border-radius:8px;background:rgba(7,7,10,.55);color:var(--ink);outline:none}.switch-field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,189,248,.09)}.switch-status{min-height:16px;margin-top:9px;color:var(--cyan);font-size:10px}.switch-status.error{color:#fca5a5}.switch-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.switch-actions .btn{margin:0}.switch-actions .btn:disabled{opacity:.65;cursor:wait}:root{--bg:#0b1020;--s1:rgba(31,38,58,.48);--s2:rgba(93,103,151,.14);--s3:rgba(204,214,255,.12);--bd:rgba(218,227,255,.10);--bd2:rgba(224,232,255,.17);--ink:#f3f4fb;--tx2:#d0d2e4;--mut:#969bb5;--ac:#a8a8d7;--ok:#7cdbbb;--bad:#ff8998;--warn:#e8c785;--cyan:#a8a8d7;--violet:#d0b6d0;--glass:rgba(220,229,255,.085);--glass-strong:rgba(197,208,255,.14);--glass-border:rgba(218,227,255,.12);--glass-hover:rgba(183,183,230,.34)}

.switch-shade{background:rgba(5,9,20,.62);backdrop-filter:blur(12px)}.switch-field input{background:rgba(20,28,48,.52)}.switch-field input[data-secret]{-webkit-text-security:disc}.switch-field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(168,168,215,.13)}</style></head><body><header class="top"><div class="brand"><span class="logo">ML</span> ML SUITE</div><div class="topright"><span class="tag"><i></i>管理员工作区</span><a class="return-workspace" href="/" title="返回 ML Suite 运营工作台">↗ 返回工作台</a><div class="account-wrap"><button class="avatar" id="avatar" type="button" aria-label="账户菜单" aria-haspopup="menu" aria-expanded="false">Y</button><div class="account-menu" id="accountMenu" role="menu" hidden><div class="menu-user"><span class="menu-face" id="menuFace">Y</span><span><b id="menuName">Yvonelam</b><small>管理员账户 · 当前会话</small></span></div><button id="switchAccount" type="button" role="menuitem"><i>⇄</i>切换账户</button><button id="logoutAccount" class="danger" type="button" role="menuitem"><i>↪</i>退出账户</button></div></div></div></header><main class="wrap"><div class="eyebrow">WORKSPACE · ADMINISTRATION</div><div class="heading"><div><h1 id="title">账户审批</h1><p id="subtitle">审核新账户申请，批准后才可进入独立工作区。</p></div><button class="btn" id="refresh">↻ 刷新</button></div><div class="layout"><nav class="glass nav"><button id="navApprovals" onclick="showView('approvals')"><span>✓</span>账户审批</button><button id="navApis" onclick="showView('apis')"><span>⌘</span>API 查询</button></nav><section class="content"><div id="error" class="error hidden"></div><div id="approvalsView" class="glass panel"><div class="panelhead"><div><h2>待审批账户</h2><p>审批通过后，账户即可登录自己的隔离工作区。</p></div><span id="pendingCount" class="pill">加载中</span></div><div id="pendingList" class="muted">正在读取申请…</div></div><div id="apisView" class="hidden"><div class="notice">这里仅显示各账户 API 的配置与授权状态。密钥、访问令牌和密码不会返回到页面。</div><div id="accountsList" class="glass panel"><div class="muted">正在读取账户配置…</div></div></div><div class="footer">ML SUITE · 管理员安全入口</div></section></div></main><div class="switch-shade" id="switchShade" hidden><section class="switch-dialog" role="dialog" aria-modal="true" aria-labelledby="switchTitle"><h2 id="switchTitle">切换账户</h2><p>输入另一个 ML Suite 账号，验证成功后切换当前会话。</p><form id="switchForm"><label class="switch-field">账号<input id="switchUsername" autocomplete="off" placeholder="输入账号名" required></label><label class="switch-field">密码<input id="switchPassword" type="text" data-secret autocomplete="off" spellcheck="false" placeholder="输入密码" required></label><div class="switch-status" id="switchStatus" aria-live="polite"></div><div class="switch-actions"><button class="btn" id="switchCancel" type="button">取消</button><button class="btn primary" id="switchSubmit" type="submit">验证并切换</button></div></form></section></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s);
/* 密钥框掩码兜底：-webkit-text-security 只有 WebKit 系（Chrome/Edge/Safari）认，
   不认的浏览器会把这些框显示成明文，那就退回 type=password。 */
if(!(typeof CSS==='object'&&CSS&&CSS.supports&&CSS.supports('-webkit-text-security','disc')))document.querySelectorAll('input[data-secret]').forEach(el=>{el.type='password'});let activeView='approvals';function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}function showView(v){activeView=v;$('#approvalsView').classList.toggle('hidden',v!=='approvals');$('#apisView').classList.toggle('hidden',v!=='apis');$('#navApprovals').classList.toggle('on',v==='approvals');$('#navApis').classList.toggle('on',v==='apis');$('#title').textContent=v==='apis'?'API 查询':'账户审批';$('#subtitle').textContent=v==='apis'?'按账户查看已绑定的 API 服务及授权状态。':'审核新账户申请，批准后才可进入独立工作区。';history.replaceState(null,'','#'+v);if(v==='apis')loadAccounts()}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function badge(text,type=''){return '<span class="badge '+type+'">'+esc(text)+'</span>'}async function request(url,options){const r=await fetch(url,{cache:'no-store',...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}async function loadPending(){try{const d=await request('/api/admin/pending');$('#pendingCount').textContent=d.pending.length+' 项待处理';if(!d.pending.length){$('#pendingList').innerHTML='<div class="empty">当前没有待审批申请。</div>';return}const table=document.createElement('table');table.className='table';table.innerHTML='<thead><tr><th>申请账户</th><th>申请时间</th><th>状态</th><th>操作</th></tr></thead>';const body=document.createElement('tbody');for(const u of d.pending){const tr=document.createElement('tr');tr.innerHTML='<td><div class="account"><span class="face">'+esc(String(u.username||'?').slice(0,1).toUpperCase())+'</span><div><b>'+esc(u.username)+'</b><small class="muted">账户申请</small></div></div></td><td>'+esc(new Date(u.createdAt).toLocaleString())+'</td><td><span class="state">● 等待审批</span></td><td><button class="btn primary" data-id="'+esc(u.id)+'" data-action="approve">批准</button><button class="btn reject" data-id="'+esc(u.id)+'" data-action="reject">拒绝</button></td>';body.appendChild(tr)}table.appendChild(body);$('#pendingList').replaceChildren(table)}catch(e){$('#error').textContent=e.message;$('#error').classList.remove('hidden')}}async function act(id,action){try{await request('/api/admin/users/'+encodeURIComponent(id)+'/'+action,{method:'POST'});toast(action==='approve'?'账户已批准':'账户已拒绝');await loadPending()}catch(e){toast(e.message)}}$('#pendingList').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.id,b.dataset.action)});const apiDefs=[['mercadoLibre','Mercado Libre','商品、订单及广告相关接口'],['dmMcp','大麦 MCP','大麦数据查询服务'],['smtp','SMTP 邮件','账户通知与邮件发送'],['pushPlus','PushPlus 推送','任务状态推送通知']];function renderAccounts(accounts){const root=$('#accountsList');root.replaceChildren();if(!accounts.length){root.innerHTML='<div class="empty">没有账户记录。</div>';return}for(const a of accounts){const box=document.createElement('div');box.className='account-card';const status=a.status==='approved'?'已批准':a.status==='pending'?'待审批':'已停用';const summary=[];const api=a.apiStatus||{};if(api.mercadoLibre?.configured)summary.push(api.mercadoLibre.authorized?'美客多已授权':'美客多待授权');for(const key of ['dmMcp','smtp','pushPlus'])if(api[key]?.configured)summary.push(({dmMcp:'大麦 MCP',smtp:'SMTP 邮件',pushPlus:'PushPlus'})[key]+'已配置');box.innerHTML='<span class="face">'+esc(String(a.username||'?').slice(0,1).toUpperCase())+'</span><div class="meta"><strong>'+esc(a.username)+'</strong><small>'+(a.role==='admin'?'管理员':'普通账户')+' · '+status+'</small></div><div class="statusline">'+esc(summary.join(' · ')||'尚未配置 API')+'</div>';root.appendChild(box);if(activeView==='apis'){const grid=document.createElement('div');grid.className='grid';for(const [key,name,desc] of apiDefs){const x=api[key]||{},card=document.createElement('article');card.className='api';let state='未配置',kind='off',detail='未检测到凭据配置';if(key==='mercadoLibre'&&x.configured){state=x.authorized?'已授权':'待授权';kind=x.authorized?'':'warn';detail=x.authorized?'应用凭据及访问令牌已就绪':'应用凭据已配置，尚未完成账号授权'}else if(key==='dmMcp'&&x.configured){state='已配置';kind='';detail='API Key 已保存'}else if(key==='smtp'&&x.configured){state='已配置';kind='';detail='邮件账号与密码已保存'}else if(key==='pushPlus'&&x.configured){state=x.enabled?'已启用':'已配置 · 未启用';kind=x.enabled?'':'warn';detail=x.enabled?'推送服务已启用':'推送令牌已保存'}card.innerHTML='<div class="apihead"><h3>'+name+'</h3>'+badge(state,kind)+'</div><p>'+desc+'</p><div class="apifoot"><span>'+detail+'</span><span>状态</span></div>';grid.appendChild(card)}root.appendChild(grid)}}}async function loadAccounts(){try{const d=await request('/api/admin/accounts');renderAccounts(d.accounts||[])}catch(e){$('#error').textContent=e.message;$('#error').classList.remove('hidden')}}$('#refresh').onclick=()=>{ $('#error').classList.add('hidden');loadPending();if(activeView==='apis')loadAccounts()};const avatar=$('#avatar'),accountMenu=$('#accountMenu'),switchShade=$('#switchShade'),switchForm=$('#switchForm'),switchStatus=$('#switchStatus'),switchSubmit=$('#switchSubmit');function closeMenu(){accountMenu.hidden=true;avatar.setAttribute('aria-expanded','false')}function closeSwitch(){switchShade.hidden=true;switchStatus.textContent='';switchStatus.classList.remove('error');switchForm.reset()}avatar.addEventListener('click',()=>{accountMenu.hidden=!accountMenu.hidden;avatar.setAttribute('aria-expanded',String(!accountMenu.hidden))});document.addEventListener('click',e=>{if(!e.target.closest('.account-wrap'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if(!switchShade.hidden)closeSwitch()}});$('#switchAccount').addEventListener('click',()=>{closeMenu();switchShade.hidden=false;$('#switchUsername').focus()});$('#switchCancel').addEventListener('click',closeSwitch);switchShade.addEventListener('click',e=>{if(e.target===switchShade)closeSwitch()});switchForm.addEventListener('submit',async e=>{e.preventDefault();if(switchSubmit.disabled)return;switchSubmit.disabled=true;switchSubmit.textContent='正在验证…';switchStatus.classList.remove('error');switchStatus.textContent='正在验证新账号…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#switchUsername').value,password:$('#switchPassword').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'切换账户失败');switchStatus.textContent='验证成功，正在切换…';location.replace('/')}catch(e){switchStatus.textContent=e.message;switchStatus.classList.add('error');switchSubmit.disabled=false;switchSubmit.textContent='验证并切换'}});$('#logoutAccount').addEventListener('click',async()=>{closeMenu();const b=$('#logoutAccount');b.disabled=true;try{const r=await fetch('/api/auth/logout',{method:'POST'});if(!r.ok)throw Error('退出失败，请重试');location.replace('/login.html?logout=1')}catch(e){b.disabled=false;toast(e.message)}});request('/api/auth/me').then(u=>{const n=String(u.username||'Y'),i=n.slice(0,1).toUpperCase();avatar.textContent=i;avatar.setAttribute('aria-label','账户菜单：'+n);$('#menuName').textContent=n;$('#menuFace').textContent=i}).catch(()=>{});loadPending();const requestedView=new URLSearchParams(location.search).get('view');const initial=requestedView==='apis'||location.hash==='#apis'?'apis':'approvals';showView(initial);

<style>
