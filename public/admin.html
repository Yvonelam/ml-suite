<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ML Suite · 管理审批</title><style>body{margin:0;background:#09090b;color:#ededf0;font:14px system-ui;padding:32px}.box{max-width:760px;margin:auto;padding:28px;border:1px solid #31313a;border-radius:16px;background:#131316}button{background:#2563eb;color:white;border:0;border-radius:7px;padding:8px 13px;cursor:pointer;margin-right:8px}.row{display:flex;justify-content:space-between;border-top:1px solid #31313a;padding:15px 0}.muted{color:#a1a1aa}</style><div class="box"><h1>账号审批</h1><p class="muted">仅管理员可批准或拒绝新账号申请。</p><div id="list">加载中…</div><p><a href="/" style="color:#38bdf8">进入工作台</a>　<button id="out">退出登录</button></p></div><script>(async()=>{const load=async()=>{const d=await fetch('/api/admin/pending').then(r=>r.json());document.getElementById('list').innerHTML=d.pending.length?d.pending.map(u=>'<div class="row"><span>'+u.username+' <small class="muted">'+new Date(u.createdAt).toLocaleString()+'</small></span><span><button onclick="act(''+u.id+'','approve')">批准</button><button onclick="act(''+u.id+'','reject')">拒绝</button></span></div>').join(''):'<p class="muted">当前没有待审批申请。</p>';};window.act=async(id,a)=>{await fetch('/api/admin/users/'+id+'/'+a,{method:'POST'});load();};document.getElementById('out').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login.html';};load();})();</script></html>
