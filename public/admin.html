<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ML Suite · 管理员工作区</title><style>
:root{color-scheme:dark;--bg:#09090b;--s1:#0e0e11;--s2:#131316;--s3:#1a1a1f;--bd:#242429;--bd2:#31313a;--ink:#ededf0;--tx2:#a1a1aa;--mut:#71717a;--ac:#3b82f6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--cyan:#38bdf8;--violet:#818cf8;--glass:rgba(255,255,255,.045);--glass-strong:rgba(255,255,255,.07);--glass-border:rgba(255,255,255,.10);--glass-hover:rgba(56,189,248,.35);--f:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','PingFang SC','Microsoft YaHei',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:13px/1.55 var(--f);background:radial-gradient(ellipse at 18% 3%,rgba(23,123,158,.16),transparent 38%),radial-gradient(ellipse at 86% 92%,rgba(86,67,166,.13),transparent 42%),var(--bg)}button{font:inherit;color:inherit;cursor:pointer}.top{height:56px;position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1160px)/2));border-bottom:1px solid var(--bd);background:rgba(9,9,11,.84);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.08em}.logo{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;background:linear-gradient(140deg,var(--cyan),var(--violet));color:#09090b;font-weight:900}.topright{display:flex;align-items:center;gap:10px}.tag{padding:5px 9px;border:1px solid var(--bd);border-radius:20px;background:var(--glass);color:var(--tx2);font-size:10px}.tag i{display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--ok)}.avatar{width:28px;height:28px;border-radius:50%;border:1px solid var(--glass-border);background:var(--s3);font-weight:700}.wrap{max-width:1160px;margin:44px auto;padding:0 24px}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--cyan)}.heading{display:flex;justify-content:space-between;align-items:end;margin:8px 0 22px}.heading h1{font-size:23px;margin:2px 0 3px}.heading p,.muted{color:var(--mut);font-size:11px;margin:0}.layout{display:grid;grid-template-columns:205px 1fr;gap:16px}.glass{border:1px solid var(--glass-border);border-radius:14px;background:linear-gradient(145deg,rgba(30,30,37,.73),rgba(16,16,20,.76));box-shadow:0 20px 65px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.045);backdrop-filter:blur(20px)}.nav{padding:9px;height:max-content}.nav button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--tx2);font-size:12px}.nav button.on{color:var(--ink);border-color:rgba(56,189,248,.18);background:linear-gradient(100deg,rgba(59,130,246,.16),rgba(56,189,248,.04))}.nav button span{color:var(--cyan);width:20px;text-align:center}.content{min-width:0}.panel{padding:20px 22px;margin-bottom:14px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.panelhead h2{font-size:14px;margin:0}.panelhead p{font-size:10px;color:var(--mut);margin:4px 0 0}.pill{padding:4px 8px;border-radius:20px;border:1px solid rgba(245,158,11,.22);color:#f5c46c;background:rgba(245,158,11,.07);font-size:10px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:10px;font-weight:500;color:var(--mut);padding:10px;border-bottom:1px solid var(--bd)}.table td{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.055);font-size:11px}.table tr:last-child td{border:0}.account{display:flex;align-items:center;gap:9px}.face{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(140deg,rgba(56,189,248,.22),rgba(129,140,248,.22));color:#c6edff;font-weight:700}.account small{display:block;color:var(--mut);font-size:9px}.state{font-size:10px;color:#f5c46c}.btn{padding:6px 10px;border:1px solid var(--bd2);border-radius:7px;background:var(--glass);font-size:10px;margin-left:5px}.btn:hover{background:var(--glass-strong)}.btn.primary{border-color:rgba(56,189,248,.35);background:linear-gradient(120deg,#2563eb,#3b82f6);box-shadow:0 5px 16px rgba(59,130,246,.2)}.btn.reject{color:#fca5a5}.empty{padding:22px;text-align:center;color:var(--mut);font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.api{padding:14px;border:1px solid rgba(255,255,255,.075);border-radius:10px;background:rgba(5,7,12,.25)}.api h3{font-size:12px;margin:0}.api p{font-size:10px;color:var(--mut);margin:6px 0 12px}.apihead{display:flex;align-items:center;justify-content:space-between}.badge{font-size:9px;padding:3px 7px;border:1px solid rgba(34,197,94,.2);border-radius:20px;color:#69e5a0;background:rgba(34,197,94,.07)}.badge.off{color:var(--tx2);border-color:var(--bd);background:var(--glass)}.badge.warn{color:#f5c46c;border-color:rgba(245,158,11,.2);background:rgba(245,158,11,.06)}.apifoot{display:flex;justify-content:space-between;color:var(--mut);font-size:9px}.account-card{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-top:9px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(7,8,12,.22)}.account-card .meta{flex:1;min-width:0}.account-card strong{font-size:11px}.account-card small{display:block;color:var(--mut);font-size:9px}.statusline{color:var(--tx2);font-size:9px;text-align:right}.hidden{display:none!important}.footer{text-align:center;padding:13px;color:#555b66;font-size:9px}.notice{margin:0 0 12px;padding:10px 12px;border:1px solid rgba(56,189,248,.15);border-radius:9px;background:rgba(56,189,248,.04);color:#94c9df;font-size:10px}.error{color:#fca5a5;padding:12px;font-size:11px}.toast{position:fixed;right:22px;bottom:20px;padding:11px 15px;border:1px solid var(--glass-border);border-radius:10px;background:rgba(24,27,34,.92);backdrop-filter:blur(16px);box-shadow:0 12px 38px #0008;opacity:0;transform:translateY(6px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:700px){.wrap{margin:25px auto;padding:0 14px}.layout{grid-template-columns:1fr}.nav{display:flex}.nav button{justify-content:center}.nav button span{width:auto}.heading{align-items:start;gap:10px;flex-direction:column}.grid{grid-template-columns:1fr}.panel{padding:15px}.table th:nth-child(2),.table td:nth-child(2){display:none}.top{padding:0 14px}}
</style></head><body><header class="top"><div class="brand"><span class="logo">ML</span> ML SUITE</div><div class="topright"><span class="tag"><i></i>管理员工作区</span><button class="avatar" id="avatar" aria-label="账户菜单">Y</button></div></header><main class="wrap"><div class="eyebrow">WORKSPACE · ADMINISTRATION</div><div class="heading"><div><h1 id="title">账户审批</h1><p id="subtitle">审核新账户申请，批准后才可进入独立工作区。</p></div><button class="btn" id="refresh">↻ 刷新</button></div><div class="layout"><nav class="glass nav"><button id="navApprovals" onclick="showView('approvals')"><span>✓</span>账户审批</button><button id="navApis" onclick="showView('apis')"><span>⌘</span>API 查询</button><button onclick="location.href='/'"><span>↗</span>返回工作台</button></nav><section class="content"><div id="error" class="error hidden"></div><div id="approvalsView" class="glass panel"><div class="panelhead"><div><h2>待审批账户</h2><p>审批通过后，账户即可登录自己的隔离工作区。</p></div><span id="pendingCount" class="pill">加载中</span></div><div id="pendingList" class="muted">正在读取申请…</div></div><div id="apisView" class="hidden"><div class="notice">这里仅显示各账户 API 的配置与授权状态。密钥、访问令牌和密码不会返回到页面。</div><div id="accountsList" class="glass panel"><div class="muted">正在读取账户配置…</div></div></div><div class="footer">ML SUITE · 管理员安全入口</div></section></div></main><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s);let activeView='approvals';function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}function showView(v){activeView=v;$('#approvalsView').classList.toggle('hidden',v!=='approvals');$('#apisView').classList.toggle('hidden',v!=='apis');$('#navApprovals').classList.toggle('on',v==='approvals');$('#navApis').classList.toggle('on',v==='apis');$('#title').textContent=v==='apis'?'API 查询':'账户审批';$('#subtitle').textContent=v==='apis'?'按账户查看已绑定的 API 服务及授权状态。':'审核新账户申请，批准后才可进入独立工作区。';history.replaceState(null,'','#'+v);if(v==='apis')loadAccounts()}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function badge(text,type=''){return '<span class="badge '+type+'">'+esc(text)+'</span>'}async function request(url,options){const r=await fetch(url,{cache:'no-store',...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}async function loadPending(){try{const d=await request('/api/admin/pending');$('#pendingCount').textContent=d.pending.length+' 项待处理';if(!d.pending.length){$('#pendingList').innerHTML='<div class="empty">当前没有待审批申请。</div>';return}const table=document.createElement('table');table.className='table';table.innerHTML='<thead><tr><th>申请账户</th><th>申请时间</th><th>状态</th><th>操作</th></tr></thead>';const body=document.createElement('tbody');for(const u of d.pending){const tr=document.createElement('tr');tr.innerHTML='<td><div class="account"><span class="face">'+esc(String(u.username||'?').slice(0,1).toUpperCase())+'</span><div><b>'+esc(u.username)+'</b><small class="muted">账户申请</small></div></div></td><td>'+esc(new Date(u.createdAt).toLocaleString())+'</td><td><span class="state">● 等待审批</span></td><td><button class="btn primary" data-id="'+esc(u.id)+'" data-action="approve">批准</button><button class="btn reject" data-id="'+esc(u.id)+'" data-action="reject">拒绝</button></td>';body.appendChild(tr)}table.appendChild(body);$('#pendingList').replaceChildren(table)}catch(e){$('#error').textContent=e.message;$('#error').classList.remove('hidden')}}async function act(id,action){try{await request('/api/admin/users/'+encodeURIComponent(id)+'/'+action,{method:'POST'});toast(action==='approve'?'账户已批准':'账户已拒绝');await loadPending()}catch(e){toast(e.message)}}$('#pendingList').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.id,b.dataset.action)});const apiDefs=[['mercadoLibre','Mercado Libre','商品、订单及广告相关接口'],['dmMcp','大麦 MCP','大麦数据查询服务'],['smtp','SMTP 邮件','账户通知与邮件发送'],['pushPlus','PushPlus 推送','任务状态推送通知']];function renderAccounts(accounts){const root=$('#accountsList');root.replaceChildren();if(!accounts.length){root.innerHTML='<div class="empty">没有账户记录。</div>';return}for(const a of accounts){const box=document.createElement('div');box.className='account-card';const status=a.status==='approved'?'已批准':a.status==='pending'?'待审批':'已停用';const summary=[];const api=a.apiStatus||{};if(api.mercadoLibre?.configured)summary.push(api.mercadoLibre.authorized?'美客多已授权':'美客多待授权');for(const key of ['dmMcp','smtp','pushPlus'])if(api[key]?.configured)summary.push(({dmMcp:'大麦 MCP',smtp:'SMTP 邮件',pushPlus:'PushPlus'})[key]+'已配置');box.innerHTML='<span class="face">'+esc(String(a.username||'?').slice(0,1).toUpperCase())+'</span><div class="meta"><strong>'+esc(a.username)+'</strong><small>'+(a.role==='admin'?'管理员':'普通账户')+' · '+status+'</small></div><div class="statusline">'+esc(summary.join(' · ')||'尚未配置 API')+'</div>';root.appendChild(box);if(activeView==='apis'){const grid=document.createElement('div');grid.className='grid';for(const [key,name,desc] of apiDefs){const x=api[key]||{},card=document.createElement('article');card.className='api';let state='未配置',kind='off',detail='未检测到凭据配置';if(key==='mercadoLibre'&&x.configured){state=x.authorized?'已授权':'待授权';kind=x.authorized?'':'warn';detail=x.authorized?'应用凭据及访问令牌已就绪':'应用凭据已配置，尚未完成账号授权'}else if(key==='dmMcp'&&x.configured){state='已配置';kind='';detail='API Key 已保存'}else if(key==='smtp'&&x.configured){state='已配置';kind='';detail='邮件账号与密码已保存'}else if(key==='pushPlus'&&x.configured){state=x.enabled?'已启用':'已配置 · 未启用';kind=x.enabled?'':'warn';detail=x.enabled?'推送服务已启用':'推送令牌已保存'}card.innerHTML='<div class="apihead"><h3>'+name+'</h3>'+badge(state,kind)+'</div><p>'+desc+'</p><div class="apifoot"><span>'+detail+'</span><span>状态</span></div>';grid.appendChild(card)}root.appendChild(grid)}}}async function loadAccounts(){try{const d=await request('/api/admin/accounts');renderAccounts(d.accounts||[])}catch(e){$('#error').textContent=e.message;$('#error').classList.remove('hidden')}}$('#refresh').onclick=()=>{ $('#error').classList.add('hidden');loadPending();if(activeView==='apis')loadAccounts()};$('#avatar').onclick=async()=>{try{await request('/api/auth/logout',{method:'POST'});location.href='/login.html?logout=1'}catch(e){toast(e.message)}};loadPending();const requestedView=new URLSearchParams(location.search).get('view');const initial=requestedView==='apis'||location.hash==='#apis'?'apis':'approvals';showView(initial);
</script></body></html>
