<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="mt md">
  <title id="mt">ML Suite · 彩色毛玻璃</title>
  <desc id="md">紫到粉的高饱和渐变底，白色 ML 字标，顶部玻璃高光与右下柔光。</desc>
  <defs>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a4ff"/>
      <stop offset=".5" stop-color="#d79df2"/>
      <stop offset="1" stop-color="#ff8fd2"/>
    </linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gr" cx=".78" cy=".86" r=".55">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="66" fill="url(#gt)"/>
  <rect width="256" height="256" rx="66" fill="url(#gr)"/>
  <rect y="0" width="256" height="120" rx="66" fill="url(#gg)" opacity=".40"/>
  <rect x="7.5" y="7.5" width="241" height="241" rx="59" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity=".55"/>
  <text x="131" y="133" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="-6">ML</text>
</svg>
